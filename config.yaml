# campwatch configuration
# Copy this file to config.yaml and edit. Never commit config.yaml (it holds
# credentials) -- it's already in .gitignore.

# ---------------------------------------------------------------------------
# ACTIVE HOURS -- when the scanner is allowed to run at all.
# Outside these windows, campwatch sleeps until the next window instead of
# polling. This is the main energy/query-reduction lever: if you can't act
# on an alert at 3 AM anyway, there's no reason to burn requests then.
# ---------------------------------------------------------------------------
schedule:
  timezone: "America/Los_Angeles"
  active_hours:
    - start: "06:30"
      end: "22:30"
  # Optional: fully skip specific days (e.g. you're always unreachable Mondays)
  skip_days: []   # e.g. ["Monday"]

# ---------------------------------------------------------------------------
# SPEED -- poll interval tiers. Slower for broad coverage, faster for
# targeted watches, and an optional "peak" boost during the hours cancellations
# actually tend to land (evenings, ~7-14 days before check-in).
# ---------------------------------------------------------------------------
speed:
  coverage_interval_minutes: 15      # baseline for the broad "coverage" list
  targeted_interval_minutes: 2       # baseline for the narrow "targeted" list
  peak:
    enabled: true
    interval_minutes: 1              # applies to targeted watches during peak windows
    windows:                         # local time, in schedule.timezone
      - start: "17:00"
        end: "21:00"
  min_request_gap_seconds: 1.5       # floor between any two API calls, regardless of config above

# ---------------------------------------------------------------------------
# COVERAGE -- broad monitoring across a set of parks/facilities. Good for
# "let me know about anything premium at any of these five parks this fall."
# Polled at speed.coverage_interval_minutes.
# ---------------------------------------------------------------------------
coverage:
  - name: "Wright's Beach 2026"
    facility_id: "706"        # find via `python campwatch.py lookup "Pfeiffer Big Sur"`
    start_date: "2026-11-25"
    end_date: "2027-01-30"
    keywords: ["premium", "hookup", "river", "ada"]   # matched against site name/short name
    exclude_ada: true               # set true to skip ADA-designated sites if you don't need one

  - name: "Van Damme Sp 2026"
    facility_id: "741"
    start_date: "2026-11-24"
    end_date: "2026-11-30"
    keywords: ["premium", "bluff", "ocean"]
    exclude_ada: true
 
 - name: "Van Damme Sp 2027"
    facility_id: "743"
    start_date: "2027-04-01"
    end_date: "2027-11-01"
    keywords: ["premium", "bluff", "ocean"]
    exclude_ada: true
# ---------------------------------------------------------------------------
# TARGETED -- narrow, high-frequency watches for a specific trip you actually
# have planned. Polled faster (speed.targeted_interval_minutes, boosted during
# peak windows). Use this sparingly -- it's the expensive option.
# ---------------------------------------------------------------------------
targeted:
  - name: "Van Damme Sp - Thanksgiving 2026"
    facility_id: "743"
    start_date: "2026-11-25"
    end_date: "2026-11-27"
    keywords: ["premium", "bluff"]
    unit_ids: []                     # optional: exact unit IDs if you know them, e.g. [12345]
    exclude_ada: true

# ---------------------------------------------------------------------------
# NOTIFICATIONS -- enable any combination. All are optional/independent.
# ---------------------------------------------------------------------------
notifications:
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    from_address: "you@gmail.com"
    from_password: "REPLACE_WITH_APP_PASSWORD"   # Gmail: use an App Password, not your real password
    to_address: "you@gmail.com"

  sms:
    enabled: false
    email: { }   # reuses notifications.email above if left empty; or override with its own SMTP block
    sms_gateway_address: "5551234567@txt.att.net"   # AT&T; see README for other carriers

  ntfy:
    enabled: false
    topic: "PLACEHOLDER"
    server: "https://ntfy.sh"
    priority: "high"

# ---------------------------------------------------------------------------
# STATE -- where campwatch remembers what it has already alerted you about,
# so it doesn't re-notify for the same open site every cycle.
# ---------------------------------------------------------------------------
state_file: "campwatch_state.json"
log_file: "campwatch.log"
